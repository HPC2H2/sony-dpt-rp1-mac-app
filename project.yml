name: DigitalPaper
options:
  bundleIdPrefix: com.danielkao.digitalpaper
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  BigInt:
    url: https://github.com/attaswift/BigInt.git
    from: "5.3.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  DigitalPaperKit:
    type: framework
    platform: macOS
    sources:
      - DigitalPaperKit
    dependencies:
      - package: BigInt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielkao.digitalpaper.kit
        GENERATE_INFOPLIST_FILE: true
        DEFINES_MODULE: true

  DigitalPaper:
    type: application
    platform: macOS
    sources:
      - DigitalPaper
    dependencies:
      - target: DigitalPaperKit
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielkao.digitalpaper.app
        INFOPLIST_FILE: DigitalPaper/Info.plist
        CODE_SIGN_ENTITLEMENTS: DigitalPaper/DigitalPaper.entitlements
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true

  DigitalPaperKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - DigitalPaperKitTests
    dependencies:
      - target: DigitalPaperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielkao.digitalpaper.kit.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  DigitalPaper:
    build:
      targets:
        DigitalPaper: all
        DigitalPaperKitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DigitalPaperKitTests
